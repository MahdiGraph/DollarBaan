<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <meta name="description" content="ورود به دلاربان؛ داشبورد شخصی پایش دارایی‌ها">
    <meta name="theme-color" content="#f4f5f7">
    <meta name="application-name" content="دلاربان">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="دلاربان">
    <title>ورود · دلاربان</title>
    <link rel="icon" href="/assets/img/logo.svg" type="image/svg+xml">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="preload" href="/assets/fonts/Vazirmatn-Variable.woff2" as="font" type="font/woff2" crossorigin>
    <script src="/assets/js/theme-init.js"></script>
    <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
    <main class="login-page">
        <button type="button" class="icon-btn login-theme" id="themeBtn" aria-label="تغییر پوسته">
            <svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#moon"></use></svg>
        </button>
        <div class="card login-card">
            <div class="login-brand">
                <img class="brand-mark" src="/assets/img/logo.svg" alt="" width="56" height="56">
                <h1>ورود به دلاربان</h1>
                <p>داشبورد شخصی پایش ارز، طلا، سکه و رمزارز</p>
            </div>
            <form class="login-form" id="loginForm" novalidate>
                <div class="alert error" id="loginError" role="alert" hidden>
                    <svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#circle-alert"></use></svg>
                    <div class="grow" id="loginErrorText"></div>
                </div>
                <div class="field">
                    <label for="username">نام کاربری</label>
                    <input id="username" name="username" class="input ltr" type="text" autocomplete="username"
                        autocapitalize="none" spellcheck="false" dir="ltr" required autofocus>
                </div>
                <div class="field">
                    <label for="password">رمز عبور</label>
                    <div class="input-group">
                        <input id="password" name="password" class="input ltr" type="password" autocomplete="current-password" dir="ltr" required>
                        <button type="button" class="icon-btn plain icon-btn-sm addon-btn" id="togglePassword" aria-label="نمایش رمز عبور">
                            <svg class="icon icon-sm" aria-hidden="true"><use href="/assets/icons.svg#eye"></use></svg>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-block" id="loginBtn" style="height:46px">
                    <span>ورود</span>
                    <svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#chevron-left"></use></svg>
                </button>
            </form>
            <p class="login-foot">نام کاربری و رمز در فایل <span class="ltr">.env</span> تنظیم می‌شوند.</p>
        </div>
    </main>
    <script type="module" src="/assets/js/login.js"></script>
</body>
</html>
